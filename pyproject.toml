[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-comment-crawler"
version = "0.1.0"
description = "A safety-first Windows desktop crawler for publicly accessible Persian comments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tekna" }]
dependencies = []

[project.optional-dependencies]
render = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
persian-comment-crawler = "persian_comment_crawler.main:main"

[tool.setuptools.packages.find]
include = ["persian_comment_crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
